<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="darkreader-lock" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      iOS takes the Home Screen icon from apple-touch-icon in preference to the
      manifest, and applies its own rounded-corner mask — so this wants the
      full-bleed square artwork, not a pre-rounded one.
    -->
    <link rel="apple-touch-icon" href="/app-icon-1024.png" />
    <link rel="icon" type="image/png" href="/app-icon-1024.png" />
    <!--
      NOT black-translucent. That mode puts page content underneath the status
      bar, and iOS then composites its own blurred scrim behind the clock so it
      stays legible over whatever is below — which is the haze across the top of
      the installed app. `black` makes iOS reserve the status bar area instead,
      so nothing renders under it and no scrim is drawn. SeatWatch omits this
      meta entirely and has never shown the band.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' https: data: blob:; media-src 'self' https: http: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; worker-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" />
    <title>Nuvio Web</title>
    <!-- Blocking, same-origin script: apply cached appearance before first paint
         without allowing inline scripts in the Content Security Policy. -->
    <script src="%BASE_URL%theme-bootstrap.js"></script>
  </head>
  <body>
    <!--
      The loading screen, and the only one shown while the app starts.

      Deliberately outside #root, so React never owns it. Rendered inside, it
      was torn down and rebuilt the moment React mounted: a new <img> that had
      to decode again (the logo flashed), a new spinner whose animation
      restarted, and a new label. Every one of those was visible in what is
      supposed to be one uninterrupted wait. React now fades this same element
      out instead of replacing it — see lib/bootSplash.ts.
    -->
    <div
      id="boot-splash"
      class="nuvio-loading-screen is-overlay"
      role="status"
      aria-label="Loading Nuvio"
    >
      <div class="nuvio-loading-brand">
        <img src="%BASE_URL%Nuvio-icon.png" width="96" height="96" alt="" />
        <span class="nuvio-loading-name">Nuvio</span>
        <i class="nuvio-loading-spinner" aria-hidden="true"></i>
        <span class="nuvio-loading-label" id="boot-splash-label">Loading Nuvio…</span>
      </div>
    </div>
    <!-- Translates the label above before the first paint. Any later than
         this and the text visibly changes, which is the swap it avoids. -->
    <script src="%BASE_URL%boot-label.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
